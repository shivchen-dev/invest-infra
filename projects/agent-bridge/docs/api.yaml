## 话题连续性

多轮对话必须**复用同一个 Bridge 实例**：

```python
bridge = DeepSeekBridge()
await bridge.start()
await bridge.ensure_login(timeout=120)

# 第一轮
r1 = await bridge.chat('你好')
# 第二轮（上下文连续）
r2 = await bridge.chat('继续追问')
# 第三轮
r3 = await bridge.chat('再继续')

await bridge.close()  # 对话全部结束后关闭
```

---

## 注意事项

- ❌ 不支持 HTTP API
- ✅ 必须使用 `async/await`
- ✅ 使用后必须 `await bridge.close()`
- ✅ 每个平台使用独立 Profile 目录

