# agent-bridge 调用文档

**版本**: v0.1.0
**更新**: 2026-04-16

> ⚠️ API 方案已移除。当前版本仅支持直接 import 调用，不提供 HTTP API。

---

## 调用方式

### Python 直接 import

```python
import sys
import asyncio
sys.path.insert(0, '/path/to/agent-bridge/src')

from deepseek_bridge import DeepSeekBridge

async def main():
    bridge = DeepSeekBridge()
    await bridge.start()
    await bridge.ensure_login(timeout=120)
    
    result = await bridge.chat('你好')
    print(result.text)
    
    await bridge.close()

asyncio.run(main())
```

---

## BridgeResponse 结构

```python
@dataclass
class BridgeResponse:
    text: str           # AI 回复文本
    success: bool       # 是否成功
    error: str | None   # 错误信息
    metadata: dict | None  # 元信息
```

