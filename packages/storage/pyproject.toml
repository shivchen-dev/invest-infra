[project]
name = "invest-storage"
version = "0.1.0"
description = "SQLAlchemy storage implementation for invest-infra-v2"
requires-python = ">=3.12,<3.13"
dependencies = [
  "invest-domain",
  "sqlalchemy>=2.0.51,<2.1",
  "psycopg[binary]>=3.3.4,<4",
]

[tool.uv.sources]
invest-domain = { path = "../domain", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/invest_storage"]
