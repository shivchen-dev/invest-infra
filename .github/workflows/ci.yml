name: ci

on:
  push:
  pull_request:

jobs:
  architecture-and-domain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/check_architecture.py
      - run: PYTHONPATH=packages/domain/src:packages/storage/src python -m unittest discover -s tests -v

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: cd apps/api && uv sync
      - run: cd apps/api && uv run ruff check src

  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: cd apps/pipeline && uv sync
      - run: cd apps/pipeline && uv run ruff check src
