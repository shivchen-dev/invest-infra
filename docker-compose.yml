# ============================================
# 智能投研体系 — Phase 0 基础设施
# PostgreSQL(数据仓库) + Redis(缓存/消息) + MinIO(对象存储)
# ============================================
version: "3.9"

networks:
  invest-net:
    name: invest-net
    driver: bridge

volumes:
  pgdata:
    driver: local
  redis-data:
    driver: local
  minio-data:
    driver: local

services:

  # ---------- PostgreSQL 16 ----------
  postgres:
    image: postgres:16
    container_name: invest-postgres
    restart: unless-stopped
    env_file:
      - .secrets/pg.env
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: investdb
      POSTGRES_USER: invest
      # POSTGRES_PASSWORD 由 .secrets/pg.env 注入（env_file 优先级高于此处同名 key）
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      TZ: Asia/Shanghai
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d:ro
    networks:
      - invest-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U invest -d investdb"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1g
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  # ---------- Redis 7 ----------
  redis:
    image: redis:7-alpine
    container_name: invest-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    environment:
      TZ: Asia/Shanghai
    volumes:
      - redis-data:/data
      - ./redis.conf:/usr/local/etc/redis/redis.conf:ro
    networks:
      - invest-net
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512m
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  # ---------- MinIO ----------
  minio:
    image: minio/minio:latest
    container_name: invest-minio
    restart: unless-stopped
    env_file:
      - .secrets/minio.env
    ports:
      - "9000:9000"   # API / S3 兼容接口
      - "9001:9001"   # Web 控制台
    environment:
      MINIO_ROOT_USER: REDACTED_MINIO_USER
      # MINIO_ROOT_PASSWORD 由 .secrets/minio.env 注入
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
      MINIO_REGION_NAME: cn-east-1
      TZ: Asia/Shanghai
    volumes:
      - minio-data:/data
    networks:
      - invest-net
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256m
    logging:
      options:
        max-size: "10m"
        max-file: "3"
