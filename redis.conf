# ============================================
# Redis Config — 智能投研体系
# ============================================
port 6379
bind 0.0.0.0

# 持久化
save 300 10
save 60 10000
appendonly yes
appendfsync everysec

# 内存管理
maxmemory 384mb
maxmemory-policy allkeys-lru

# 连接
tcp-keepalive 300
timeout 300

# 慢查询
slowlog-log-slower-than 10000
slowlog-max-len 128

# Key 空间通知（用于消息队列场景）
notify-keyspace-events KEA
