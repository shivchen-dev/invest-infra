  <rect x="727" y="158" width="130" height="52" rx="6" class="node process" />
  <text x="792" y="180" text-anchor="middle" class="label">etf_alpha.py</text>
  <text x="792" y="196" text-anchor="middle" class="small">ETF Alpha</text>
  <text x="792" y="210" text-anchor="middle" class="small">ETF 套利信号</text>

  <rect x="727" y="226" width="130" height="52" rx="6" class="node process" />
  <text x="792" y="248" text-anchor="middle" class="label">etf_arbitrage.py</text>
  <text x="792" y="264" text-anchor="middle" class="small">ETF 跨市场价差</text>
  <text x="792" y="278" text-anchor="middle" class="small">事件驱动</text>

  <rect x="727" y="294" width="130" height="52" rx="6" class="node process" />
  <text x="792" y="316" text-anchor="middle" class="label">scoring.py</text>
  <text x="792" y="332" text-anchor="middle" class="small">综合评分</text>
  <text x="792" y="346" text-anchor="middle" class="small">多维度</text>

  <!-- ====== AGENT / ORCHESTRATION LAYER ====== -->
  <rect x="885" y="50" width="195" height="640" rx="8" class="zone" />
  <text x="982" y="70" text-anchor="middle" class="zone-label">智能体层 · Agent</text>

  <!-- CIA -->
  <rect x="897" y="90" width="170" height="72" rx="8" class="node agent" />
