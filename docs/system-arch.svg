  <text x="982" y="222" text-anchor="middle" class="small">Workflow Orchestration</text>
  <text x="982" y="238" text-anchor="middle" class="small">Morning Briefing</text>
  <text x="982" y="252" text-anchor="middle" class="small">任务调度 +回调</text>

  <!-- CCR -->
  <rect x="897" y="270" width="170" height="72" rx="8" class="node agent" />
  <text x="982" y="295" text-anchor="middle" class="label">CCR</text>
  <text x="982" y="312" text-anchor="middle" class="small">Code Critic Reviewer</text>
  <text x="982" y="328" text-anchor="middle" class="small">代码审查 + 重构</text>
  <text x="982" y="342" text-anchor="middle" class="small">tmux: ccr-work</text>

  <!-- Reports -->
  <rect x="897" y="360" width="170" height="52" rx="6" class="node process" />
  <text x="982" y="382" text-anchor="middle" class="label">reports/</text>
  <text x="982" y="398" text-anchor="middle" class="small">日报/周报/审计报告</text>
  <text x="982" y="412" text-anchor="middle" class="small">memo_rules</text>

  <!-- Alert -->
  <rect x="897" y="428" width="170" height="52" rx="6" class="node risk" />
  <text x="982" y="450" text-anchor="middle" class="label">alert.py</text>
  <text x="982" y="466" text-anchor="middle" class="small">风险监控 + 告警</text>
  <text x="982" y="480" text-anchor="middle" class="small">risk_monitor</text>

  <!-- A2A Client -->
  <rect x="897" y="496" width="170" height="52" rx="6" class="node process" />
  <text x="982" y="518" text-anchor="middle" class="label">jiuwen_a2a_client.py</text>
  <text x="982" y="534" text-anchor="middle" class="small">JiuwenSwarm A2A</text>
  <text x="982" y="548" text-anchor="middle" class="small">:19100</text>

  <!-- ====== CRON SCHEDULER ====== -->
