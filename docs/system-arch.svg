  <text x="982" y="132" text-anchor="middle" class="small">Chief Investment Agent</text>
  <text x="982" y="148" text-anchor="middle" class="small">整合 + 洞察 + 风控</text>
  <text x="982" y="162" text-anchor="middle" class="small">F/Q/I/R 框架</text>

  <!-- WOA -->
  <rect x="897" y="180" width="170" height="72" rx="8" class="node agent" />
