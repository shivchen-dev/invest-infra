  <rect x="897" y="642" width="170" height="36" rx="5" class="node neutral" />
  <text x="982" y="665" text-anchor="middle" class="label">cron_watchdog.py</text>

  <!-- ====== FLOW ARROWS ====== -->
  <!-- Sources → Collector -->
  <path d="M135,106 L165,106" class="edge" marker-end="url(#arr)" />
  <path d="M135,166 L165,153" class="edge" marker-end="url(#arr)" />
  <path d="M135,226 L165,200" class="edge" marker-end="url(#arr)" />
