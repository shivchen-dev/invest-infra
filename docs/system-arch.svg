  <rect x="527" y="182" width="162" height="38" rx="5" class="node process" />
  <text x="608" y="206" text-anchor="middle" class="label">alternative.py</text>
  <text x="608" y="195" text-anchor="middle" class="small">另类因子</text>

  <rect x="527" y="232" width="162" height="38" rx="5" class="node process" />
  <text x="608" y="256" text-anchor="middle" class="label">advanced.py</text>
  <text x="608" y="245" text-anchor="middle" class="small">高级因子</text>

  <rect x="527" y="282" width="162" height="38" rx="5" class="node process" />
  <text x="608" y="306" text-anchor="middle" class="label">etf_fundamental.py</text>
  <text x="608" y="295" text-anchor="middle" class="small">ETF 基本面</text>

  <rect x="527" y="332" width="162" height="38" rx="5" class="node process" />
  <text x="608" y="356" text-anchor="middle" class="label">etf_risk.py</text>
  <text x="608" y="345" text-anchor="middle" class="small">ETF 风险</text>

  <rect x="527" y="382" width="162" height="38" rx="5" class="node process" />
  <text x="608" y="406" text-anchor="middle" class="label">etf_info_flow.py</text>
  <text x="608" y="395" text-anchor="middle" class="small">ETF 信息流</text>

  <rect x="527" y="432" width="162" height="38" rx="5" class="node process" />
  <text x="608" y="456" text-anchor="middle" class="label">registry.py</text>
  <text x="608" y="445" text-anchor="middle" class="small">因子注册表</text>

  <rect x="527" y="482" width="162" height="38" rx="5" class="node process" />
  <text x="608" y="506" text-anchor="middle" class="label">base.py + engine.py</text>
  <text x="608" y="495" text-anchor="middle" class="small">因子引擎</text>

  <!-- ====== SIGNAL LAYER ====== -->
  <rect x="715" y="50" width="155" height="640" rx="8" class="zone" />
  <text x="792" y="70" text-anchor="middle" class="zone-label">信号层 · signals/</text>

  <rect x="727" y="90" width="130" height="52" rx="6" class="node process" />
