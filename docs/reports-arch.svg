  <rect x="188" y="374" width="174" height="36" rx="5" class="node neutral" />
  <text x="275" y="398" text-anchor="middle" class="label">market_data_collector.py</text>
  <text x="275" y="387" text-anchor="middle" class="small">market_data_collector · 数据采集</text>

