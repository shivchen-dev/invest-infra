<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>汇报模块架构图</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f8fafc;
    --fg: #172033;
    --muted: #5b6475;
    --line: #64748b;
    --neutral: #e2e8f0;
    --input: #bfdbfe;
    --process: #c7d2fe;
    --storage: #99f6e4;
    --external: #fde68a;
    --risk: #fecaca;
    --agent: #e9d5ff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f172a;
      --fg: #e5e7eb;
      --muted: #a3adbd;
      --line: #94a3b8;
      --neutral: #334155;
      --input: #1d4ed8;
      --process: #4338ca;
      --storage: #0f766e;
      --external: #92400e;
      --risk: #991b1b;
      --agent: #6b21a8;
    }
  }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 13px/1.4 ui-sans-serif, system-ui, sans-serif; }
  main { max-width: 1100px; margin: 24px auto; padding: 0 20px; }
  svg { width: 100%; height: auto; display: block; }
  .title { font-size: 19px; font-weight: 650; fill: var(--fg); }
  .label { font-size: 13px; font-weight: 600; fill: var(--fg); }
  .small { font-size: 11px; fill: var(--muted); }
  .node { stroke: var(--line); stroke-width: 1.5; }
  .neutral { fill: var(--neutral); }
  .input { fill: var(--input); }
  .process { fill: var(--process); }
  .storage { fill: var(--storage); }
  .external { fill: var(--external); }
  .risk { fill: var(--risk); }
  .agent { fill: var(--agent); }
  .edge { stroke: var(--line); stroke-width: 1.5; fill: none; }
  .zone { fill: none; stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 6 5; opacity: 0.7; }
  .zone-label { font-size: 12px; font-weight: 700; fill: var(--muted); }
</style>
<main>
<svg viewBox="0 0 1050 680" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#64748b"/>
    </marker>
    <marker id="arrd" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <text x="525" y="26" text-anchor="middle" class="title">汇报模块 (reports/) — 架构详图</text>

  <!-- ====== LEFT COLUMN: MCP DATA SOURCES ====== -->
  <rect x="10" y="44" width="150" height="590" rx="8" class="zone" />
  <text x="85" y="62" text-anchor="middle" class="zone-label">MCP 数据源</text>

  <rect x="22" y="74" width="116" height="52" rx="6" class="node external" />
 <text x="80" y="96" text-anchor="middle" class="label">MCP Client</text>
  <text x="80" y="112" text-anchor="middle" class="small">wudao_aStock_*</text>
  <text x="80" y="126" text-anchor="middle" class="small">批量获取行情</text>

  <rect x="22" y="138" width="116" height="52" rx="6" class="node storage" />
  <text x="80" y="160" text-anchor="middle" class="label">MarketDataCache</text>
  <text x="80" y="176" text-anchor="middle" class="small">内存缓存</text>
  <text x="80" y="190" text-anchor="middle" class="small">TTL 控制</text>

  <rect x="22" y="202" width="116" height="52" rx="6" class="node storage" />
  <text x="80" y="224" text-anchor="middle" class="label">daily_market_snapshot</text>
  <text x="80" y="240" text-anchor="middle" class="small">PG 表</text>
  <text x="80" y="254" text-anchor="middle" class="small">T-1 快照</text>

  <!-- ====== MIDDLE: REPORT ENGINE ====== -->
  <rect x="175" y="44" width="200" height="590" rx="8" class="zone" />
  <text x="275" y="62" text-anchor="middle" class="zone-label">report_engine.py</text>

  <rect x="188" y="76" width="174" height="46" rx="6" class="node process" />
  <text x="275" y="100" text-anchor="middle" class="label">ReportEngine</text>
  <text x="275" y="116" text-anchor="middle" class="small">report_type · trade_date</text>

  <rect x="188" y="134" width="174" height="36" rx="5" class="node neutral" />
