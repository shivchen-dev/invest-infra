  <!-- Cache → Snapshot → ReportEngine -->
  <path d="M136,164 L175,165" class="edge" marker-end="url(#arr)" />
  <path d="M136,228 L175,231" class="edge" marker-end="url(#arr)" />

  <!-- ReportEngine → modules -->
