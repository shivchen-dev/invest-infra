  <rect x="188" y="230" width="174" height="36" rx="5" class="node neutral" />
  <text x="275" y="254" text-anchor="middle" class="label">formatters.py</text>
  <text x="275" y="243" text-anchor="middle" class="small">format_report · 格式化输出</text>

  <rect x="188" y="278" width="174" height="36" rx="5" class="node neutral" />
  <text x="275" y="302" text-anchor="middle" class="label">mcp_client.py</text>
  <text x="275" y="291" text-anchor="middle" class="small">get_batch_mcp_client · MCP批量</text>

  <rect x="188" y="326" width="174" height="36" rx="5" class="node neutral" />
  <text x="275" y="350" text-anchor="middle" class="label">qq_push.py</text>
