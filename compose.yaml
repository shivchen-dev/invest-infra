services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-invest}
      POSTGRES_USER: ${POSTGRES_USER:-invest}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-invest_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-invest} -d ${POSTGRES_DB:-invest}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-invest}:${POSTGRES_PASSWORD:-invest_dev_password}@postgres:5432/${POSTGRES_DB:-invest}
      API_CORS_ORIGINS: http://localhost:3001
      STRATEGY_ARTIFACT_ROOT: /workspace/var/strategy-artifacts
    ports:
      - "8000:8000"
    volumes:
      - ./var/strategy-artifacts:/workspace/var/strategy-artifacts:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: apps/web
      dockerfile: Dockerfile
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      # 3001 是浏览器业务入口；5173 仅为容器内部 Vite 端口。
      - "3001:5173"
    depends_on:
      - api
    restart: unless-stopped

  dagster:
    build:
      context: .
      dockerfile: apps/pipeline/Dockerfile
    env_file:
      - ./apps/pipeline/.env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-invest}:${POSTGRES_PASSWORD:-invest_dev_password}@postgres:5432/${POSTGRES_DB:-invest}
      DAGSTER_HOME: /workspace/.dagster
      INVEST_PIPELINE_WORKBUDDY_BRIDGE_ROOT: /shared/workbuddy
      INVEST_PIPELINE_WORKBUDDY_SOURCE_DIR: /shared/workbuddy/candidate/results
      INVEST_PIPELINE_WORKBUDDY_AUTO_SCHEDULE_ENABLED: "false"
    ports:
      - "3000:3000"
    volumes:
      - dagster-home:/workspace/.dagster
      - /home/claw/windows-ltsc/shared:/shared
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  dagster-home:
