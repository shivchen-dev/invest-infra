[project]
name = "invest-migrations"
version = "0.1.0"
description = "Alembic migration runner for invest-infra-v2"
requires-python = ">=3.12,<3.13"
dependencies = [
  "invest-storage",
  "alembic>=1.18,<2",
  "sqlalchemy>=2.0.51,<2.1",
  "psycopg[binary]>=3.3.4,<4",
]

[tool.uv.sources]
invest-storage = { path = "../../packages/storage", editable = true }

[tool.uv]
package = false
