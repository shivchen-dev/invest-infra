[project]
name = "invest-api"
version = "0.1.0"
description = "FastAPI application for invest-infra-v2"
requires-python = ">=3.12,<3.15"
dependencies = [
  "invest-domain",
  "invest-storage",
  "fastapi>=0.140.4,<1",
  "uvicorn[standard]>=0.35,<1",
  "pydantic-settings>=2.10,<3",
  "sqlalchemy>=2.0.51,<2.1",
  "psycopg[binary]>=3.3.4,<4",
  "alembic>=1.18.5,<2",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]

[tool.uv.sources]
invest-domain = { path = "../../packages/domain", editable = true }
invest-storage = { path = "../../packages/storage", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/invest_api"]

[tool.fastapi]
entrypoint = "invest_api.main:app"
